<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#ffffff" />

  <!-- Left Section: Variable Concept -->
  <text x="200" y="50" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">変数（箱とラベル）</text>

  <!-- Box for the value -->
  <rect x="80" y="140" width="240" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  <text x="200" y="235" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="56" fill="#334155" text-anchor="middle">1500</text>

  <!-- Label "price" attached to the box -->
  <rect x="80" y="100" width="120" height="40" rx="6" fill="#2563eb" />
  <text x="140" y="130" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">price</text>

  <!-- Code snippet representation -->
  <rect x="50" y="320" width="300" height="60" rx="8" fill="#1e293b" />
  <text x="200" y="362" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="32" fill="#f8fafc" text-anchor="middle">price = 1500</text>

  <!-- Divider line -->
  <line x1="400" y1="30" x2="400" y2="390" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Right Section: Data Types -->
  <text x="600" y="50" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">基本データ型</text>

  <!-- int -->
  <rect x="440" y="100" width="320" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
  <text x="460" y="140" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#334155">整数 (int)</text>
  <text x="740" y="141" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="26" fill="#2563eb" text-anchor="end">1500</text>

  <!-- float -->
  <rect x="440" y="180" width="320" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
  <text x="460" y="220" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#334155">浮動小数点数 (float)</text>
  <text x="740" y="221" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="26" fill="#2563eb" text-anchor="end">0.1</text>

  <!-- str -->
  <rect x="440" y="260" width="320" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
  <text x="460" y="300" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#334155">文字列 (str)</text>
  <text x="740" y="301" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="26" fill="#2563eb" text-anchor="end">"データ"</text>

  <!-- bool -->
  <rect x="440" y="340" width="320" height="60" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="3" />
  <text x="460" y="380" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="22" fill="#334155">真偽値 (bool)</text>
  <text x="740" y="381" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="26" fill="#2563eb" text-anchor="end">True</text>

</svg>
