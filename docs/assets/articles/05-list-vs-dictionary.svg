<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff" />

  <!-- List Section -->
  <text x="200" y="50" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="24" font-weight="bold" fill="#334155" text-anchor="middle">リスト（List）</text>
  <text x="200" y="90" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">順番に並べて管理</text>

  <rect x="20" y="120" width="360" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <rect x="40" y="150" width="320" height="60" rx="6" fill="#1e293b" />
  <text x="200" y="190" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="28" fill="#f8fafc" text-anchor="middle">[ 1200, 1500, 1800 ]</text>

  <!-- Indices -->
  <line x1="100" y1="210" x2="100" y2="250" stroke="#64748b" stroke-width="3" />
  <line x1="200" y1="210" x2="200" y2="250" stroke="#64748b" stroke-width="3" />
  <line x1="300" y1="210" x2="300" y2="250" stroke="#64748b" stroke-width="3" />

  <text x="100" y="280" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="middle">0</text>
  <text x="200" y="280" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="middle">1</text>
  <text x="300" y="280" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="24" font-weight="bold" fill="#2563eb" text-anchor="middle">2</text>

  <text x="200" y="330" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="18" font-weight="bold" fill="#64748b" text-anchor="middle">インデックス番号</text>


  <!-- Divider line -->
  <line x1="400" y1="30" x2="400" y2="370" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,6" />


  <!-- Dictionary Section -->
  <text x="600" y="50" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="24" font-weight="bold" fill="#334155" text-anchor="middle">辞書（Dictionary）</text>
  <text x="600" y="90" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">キーと値のペアで管理</text>

  <rect x="420" y="120" width="360" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <rect x="440" y="150" width="320" height="60" rx="6" fill="#1e293b" />
  <text x="600" y="188" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="20" fill="#f8fafc" text-anchor="middle">{ "name": "田中", "age": 30 }</text>

  <!-- Keys -->
  <line x1="510" y1="270" x2="510" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="680" y1="270" x2="680" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />

  <text x="510" y="300" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">name</text>
  <text x="680" y="300" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, monospace, sans-serif" font-size="20" font-weight="bold" fill="#2563eb" text-anchor="middle">age</text>

  <text x="600" y="330" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="18" font-weight="bold" fill="#64748b" text-anchor="middle">キー</text>

</svg>
