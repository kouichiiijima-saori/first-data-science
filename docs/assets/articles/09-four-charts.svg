<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1300" viewBox="0 0 800 1300">
  <rect width="800" height="1300" fill="#ffffff" />

  <text x="400" y="60" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="32" font-weight="bold" fill="#334155" text-anchor="middle">4大グラフの用途比較</text>
  <text x="400" y="110" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="26" fill="#64748b" text-anchor="middle">目的に合わせて最適なグラフを選びます</text>

  <!-- 1. 棒グラフ -->
  <rect x="100" y="160" width="600" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <rect x="140" y="200" width="120" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <line x1="150" y1="310" x2="250" y2="310" stroke="#94a3b8" stroke-width="4" />
  <line x1="150" y1="310" x2="150" y2="210" stroke="#94a3b8" stroke-width="4" />
  
  <rect x="165" y="230" width="20" height="80" fill="#2563eb" />
  <rect x="195" y="260" width="20" height="50" fill="#2563eb" />
  <rect x="225" y="220" width="20" height="90" fill="#2563eb" />

  <text x="320" y="245" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="32" font-weight="bold" fill="#334155" text-anchor="start">棒グラフ</text>
  <text x="320" y="305" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="26" fill="#334155" text-anchor="start">項目ごとの大きさを比較</text>


  <!-- 2. 折れ線グラフ -->
  <rect x="100" y="400" width="600" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <rect x="140" y="440" width="120" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <line x1="150" y1="550" x2="250" y2="550" stroke="#94a3b8" stroke-width="4" />
  <line x1="150" y1="550" x2="150" y2="450" stroke="#94a3b8" stroke-width="4" />
  
  <polyline points="165,520 195,490 225,500 245,460" fill="none" stroke="#2563eb" stroke-width="4" />
  <circle cx="165" cy="520" r="4" fill="#2563eb" />
  <circle cx="195" cy="490" r="4" fill="#2563eb" />
  <circle cx="225" cy="500" r="4" fill="#2563eb" />
  <circle cx="245" cy="460" r="4" fill="#2563eb" />

  <text x="320" y="485" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="32" font-weight="bold" fill="#334155" text-anchor="start">折れ線グラフ</text>
  <text x="320" y="545" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="26" fill="#334155" text-anchor="start">時間による変化を見る</text>


  <!-- 3. 散布図 -->
  <rect x="100" y="640" width="600" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <rect x="140" y="680" width="120" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <line x1="150" y1="790" x2="250" y2="790" stroke="#94a3b8" stroke-width="4" />
  <line x1="150" y1="790" x2="150" y2="690" stroke="#94a3b8" stroke-width="4" />
  
  <circle cx="170" cy="770" r="4" fill="#2563eb" />
  <circle cx="180" cy="760" r="4" fill="#2563eb" />
  <circle cx="190" cy="740" r="4" fill="#2563eb" />
  <circle cx="200" cy="750" r="4" fill="#2563eb" />
  <circle cx="215" cy="710" r="4" fill="#2563eb" />
  <circle cx="225" cy="720" r="4" fill="#2563eb" />
  <circle cx="240" cy="700" r="4" fill="#2563eb" />

  <text x="320" y="725" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="32" font-weight="bold" fill="#334155" text-anchor="start">散布図</text>
  <text x="320" y="785" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="26" fill="#334155" text-anchor="start">2つの数値の関係を見る</text>


  <!-- 4. ヒストグラム -->
  <rect x="100" y="880" width="600" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <rect x="140" y="920" width="120" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <line x1="150" y1="1030" x2="265" y2="1030" stroke="#94a3b8" stroke-width="4" />
  <line x1="150" y1="1030" x2="150" y2="930" stroke="#94a3b8" stroke-width="4" />
  
  <rect x="155" y="1000" width="20" height="30" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
  <rect x="175" y="960" width="20" height="70" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
  <rect x="195" y="940" width="20" height="90" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
  <rect x="215" y="970" width="20" height="60" fill="#2563eb" stroke="#ffffff" stroke-width="1" />
  <rect x="235" y="1010" width="20" height="20" fill="#2563eb" stroke="#ffffff" stroke-width="1" />

  <text x="320" y="965" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="32" font-weight="bold" fill="#334155" text-anchor="start">ヒストグラム</text>
  <text x="320" y="1025" font-family="'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif" font-size="26" fill="#334155" text-anchor="start">データの分布を見る</text>

</svg>
