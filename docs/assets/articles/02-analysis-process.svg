      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="800" height="380" fill="#ffffff" />

  <!-- Flow Lines -->
  <line x1="255" y1="80" x2="285" y2="80" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="510" y1="80" x2="540" y2="80" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  
  <!-- Path from 3 to 4 -->
  <path d="M 655 120 L 655 180 L 145 180 L 145 235" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  
  <line x1="255" y1="280" x2="285" y2="280" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="510" y1="280" x2="540" y2="280" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

